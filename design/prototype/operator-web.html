<!doctype html><html lang="zh-CN" class="publy-web"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator web states · Publy prototype</title><link rel="stylesheet" href="public-web.css"><style>.operator-demo{max-width:900px;margin:auto;padding:24px}.login-panel{max-width:460px;padding:24px;border-radius:12px}.nav-demo{display:flex;gap:8px;overflow:auto;margin:24px 0}.nav-item{background:transparent;color:var(--ink);border:0;padding:12px;white-space:nowrap}.nav-item[aria-current=page]{background:var(--tint);color:var(--green)}.card-head,.feed-title,.toolbar-right{display:flex;align-items:center;gap:12px;justify-content:space-between}.toolbar-right{flex:1 1 auto;min-width:0}.search{flex:1 1 auto;min-width:0}@media(max-width:860px){.toolbar-right{align-self:stretch}}.btn{background:transparent;color:var(--green);border:1px solid var(--line);padding:10px 16px;white-space:nowrap}h3{margin:0}.muted{color:var(--muted)}.badge-red{padding:8px}.login-panel label{margin-top:16px}.op-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.op-theme{flex:none;width:44px;min-height:44px;padding:0;display:grid;place-items:center;border:0;background:transparent;color:var(--muted)}.op-theme:hover{background:var(--tint);color:var(--ink)}.op-theme svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.op-theme .ico-moon{display:none}html.publy-web[data-theme="dark"] .op-theme .ico-sun{display:none}html.publy-web[data-theme="dark"] .op-theme .ico-moon{display:block}@media(prefers-color-scheme:dark){html.publy-web:not([data-theme="light"]) .op-theme .ico-sun{display:none}html.publy-web:not([data-theme="light"]) .op-theme .ico-moon{display:block}}</style></head><body><main class="operator-demo"><div class="op-head"><div><h1>运营后台 · 状态原型</h1><p>页面仅演示，不登录、不联网、不保存凭据。</p></div><button type="button" class="op-theme" data-theme-switch aria-pressed="false" aria-label="切换深色主题" title="切换深色主题"><svg class="ico-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"></path></svg><svg class="ico-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.2 8.2 0 0 1 8.8 4a8.4 8.4 0 1 0 11.2 11.2Z"></path></svg></button></div><nav class="nav-demo" aria-label="主导航"><button class="nav-item" aria-current="page">概览</button><button class="nav-item">草稿任务</button><button class="nav-item">待核对</button><button class="nav-item">公众号账号</button><button class="nav-item">实时动态</button><button class="nav-item">退出登录</button></nav><section class="login-panel"><h2>登录运营控制台</h2><label for="demo-key">Admin key</label><input id="demo-key" type="password" autocomplete="off" disabled><p class="muted">登录面板在亮暗主题中保持可读。</p></section><section class="card" style="margin-top:24px"><div class="card-head"><div class="feed-title"><h3>实时动态</h3><span class="muted">连接失败：无法获取短期凭证</span></div><div class="toolbar-right"><input class="search" aria-label="网关地址" value="wss://example.test/events" readonly><button class="btn">重连</button></div></div><p>窄屏按标题、状态、连接控件依次换行；导航保留文字及退出入口。</p><span class="badge-red">需要检查连接，不等于投递失败</span></section></main><script src="public-web.js"></script><script>
// Prototype scaffold: the theme icon and its name follow the active theme; public-web.js owns the switch itself.
(function(){var root=document.documentElement,button=document.querySelector('[data-theme-switch]'),media=matchMedia('(prefers-color-scheme:dark)');
function sync(){var dark=root.dataset.theme?root.dataset.theme==='dark':media.matches,label=dark?'切换浅色主题':'切换深色主题';button.setAttribute('aria-label',label);button.title=label}
sync();new MutationObserver(sync).observe(root,{attributes:true,attributeFilter:['data-theme']});(media.addEventListener?media.addEventListener('change',sync):media.addListener(sync))})();
</script></body></html>
