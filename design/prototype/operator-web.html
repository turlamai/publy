<!doctype html><html lang="zh-CN" class="publy-web"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operator web states · Publy prototype</title><link rel="stylesheet" href="public-web.css"><style>.operator-demo{max-width:900px;margin:auto;padding:24px}.login-panel{max-width:460px;padding:24px;border-radius:12px}.nav-demo{display:flex;gap:8px;overflow:auto;margin:24px 0}.nav-item{background:transparent;color:var(--ink);border:0;padding:12px;white-space:nowrap}.nav-item[aria-current=page]{background:var(--tint);color:var(--green)}.card-head,.feed-title,.toolbar-right{display:flex;align-items:center;gap:12px;justify-content:space-between}.search{min-width:0}.btn{background:transparent;color:var(--green);border:1px solid var(--line);padding:10px 16px}h3{margin:0}.muted{color:var(--muted)}.badge-red{padding:8px}.login-panel label{margin-top:16px}</style></head><body><main class="operator-demo"><h1>运营后台 · 状态原型</h1><p>页面仅演示，不登录、不联网、不保存凭据。</p><button type="button" data-theme-switch>亮 / 暗</button><nav class="nav-demo" aria-label="主导航"><button class="nav-item" aria-current="page">概览</button><button class="nav-item">草稿任务</button><button class="nav-item">待核对</button><button class="nav-item">公众号账号</button><button class="nav-item">实时动态</button><button class="nav-item">退出登录</button></nav><section class="login-panel"><h2>登录运营控制台</h2><label for="demo-key">Admin key</label><input id="demo-key" type="password" autocomplete="off" disabled><p class="muted">登录面板在亮暗主题中保持可读。</p></section><section class="card" style="margin-top:24px"><div class="card-head"><div class="feed-title"><h3>实时动态</h3><span class="muted">连接失败：无法获取短期凭证</span></div><div class="toolbar-right"><input class="search" aria-label="网关地址" value="wss://example.test/events" readonly><button class="btn">重连</button></div></div><p>窄屏按标题、状态、连接控件依次换行；导航保留文字及退出入口。</p><span class="badge-red">需要检查连接，不等于投递失败</span></section></main><script src="public-web.js"></script></body></html>
