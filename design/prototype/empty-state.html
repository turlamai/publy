<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publy — 预览面板空态原型</title>
<link rel="stylesheet" href="shared.css">
<style>
  /* ==== 预览面板空态：没有活动笔记（首次打开 / 全部笔记关闭） ==== */
  .noNote { min-height: 100%; display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 13px; }
  .editor.empty-ed { display: flex; align-items: center; justify-content: center; color: var(--mute); font-size: 13px; }
  .panel .body { display: flex; flex-direction: column; }
  .empty { flex: 1; }
  .nextsteps { margin: auto 12px 14px; border-top: 1px solid var(--line); padding-top: 12px; font-size: 12.5px; color: var(--mute); line-height: 1.7; }
  .nextsteps .step { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
  .nextsteps .n { width: 16px; height: 16px; flex: none; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; margin-top: 2px; }
  .nextsteps b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="window" id="app">
    <div class="tabbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="tabs">
        <div class="tab active">没有打开的笔记</div>
      </div>
      <div class="sp"></div>
      <button class="iconbtn" id="themeBtn" title="切换亮暗主题">◐</button>
    </div>
    <div class="split">
      <section class="editor empty-ed">没有活动笔记 — 从左侧文件列表打开一篇 Markdown</section>
      <aside class="panel">
        <div class="leafhead">
          <span class="vt">➤ Publy 预览</span>
          <span class="sp"></span>
          <button class="iconbtn" title="打开发布历史与待发任务">≡</button>
        </div>
        <div class="body">
          <div class="empty">
            <div class="eicon">➤</div>
            <div>打开一篇笔记，这里会实时预览它的公众号排版</div>
          </div>
          <div class="nextsteps">
            <div class="step"><span class="n">1</span><div><b>本地预览零配置</b>：不联网、不需要账号，文章与文字卡片都能看。</div></div>
            <div class="step"><span class="n">2</span><div><b>投递需要服务</b>：在设置里填 Server 地址与 API key，用「测试连接」验证。</div></div>
            <div class="step"><span class="n">3</span><div><b>投递前有检查</b>：封面、图片、脚注与长度会先过一遍发布前检查。</div></div>
          </div>
        </div>
      </aside>
    </div>
    <div class="statusbar">
      <span>本地预览 · 未联网 · 原文未修改</span>
      <span class="sp"></span>
      <span>Obsidian · Publy 0.8.7</span>
    </div>
  </div>
  <script>
    document.getElementById('themeBtn').addEventListener('click', () => {
      document.getElementById('app').classList.toggle('dark');
    });
  </script>
</body>
</html>
