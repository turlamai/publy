<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#D97757"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; frame-src 'self' about:; base-uri 'none'; form-action 'none'"><title>Publy · Local preview</title><link rel="stylesheet" href="workbench.css"></head>
<body><header><a class="brand" href="./">Publy</a><span id="stage">本地预览开发版</span><button id="language" type="button">EN</button></header>
<main><div class="toolbar"><label class="file-button"><span id="open-label">打开 Markdown</span><input id="file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown"></label><span id="filename"></span><label><span id="theme-label">文章主题</span> <select id="theme"><option>claude</option><option>medium</option><option>wechat</option><option>ink</option><option>tech</option><option>rose</option><option>official</option><option>fortune</option><option>terminal</option><option>news</option></select></label><label><span id="width-label">预览宽度</span> <select id="width"><option value="390">390 px</option><option value="700">700 px</option></select></label></div>
<div class="split"><section><label id="source-label" for="source">Markdown 原文</label><textarea id="source" spellcheck="false" placeholder="# Hello, Publy"></textarea></section><section class="preview"><h2 id="preview-label">文章预览</h2><div class="paper"><iframe id="preview" title="Article preview" sandbox=""></iframe></div></section></div>
<p id="status" role="status" aria-live="polite"></p><p id="limits">仅支持文本预览；暂不支持图片、公式、富文本复制与草稿投递。</p></main><script src="workbench.js" defer></script></body></html>
