<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#D97757"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src https://publy-api.jrtx.site; frame-src 'self' about:; img-src data:; base-uri 'none'; form-action 'none'"><title>Publy · Local preview</title><link rel="stylesheet" href="workbench.css"></head>
<body><header><a class="brand" href="./">Publy</a><span id="stage">本地预览开发版</span><button id="language" type="button">EN</button></header>
<main><div class="toolbar"><label class="file-button"><span id="open-label">打开 Markdown</span><input id="file" type="file" accept=".md,.markdown,.txt,text/plain,text/markdown"></label><span id="filename"></span><label class="media-button"><span id="media-label">添加图片</span><input id="media" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp"></label><label class="media-button"><span id="folder-label">添加图片目录</span><input id="folder" type="file" webkitdirectory multiple></label><button id="clear-media" type="button">清除图片</button><button id="copy" type="button" disabled>复制富文本</button><button id="draft-open" class="draft-primary" type="button" disabled>投递草稿</button><label><span id="theme-label">文章主题</span> <select id="theme"><option>claude</option><option>medium</option><option>wechat</option><option>ink</option><option>tech</option><option>rose</option><option>official</option><option>fortune</option><option>terminal</option><option>news</option></select></label><label><span id="width-label">预览宽度</span> <select id="width"><option value="390">390 px</option><option value="700">700 px</option></select></label></div>
<div class="split"><section><label id="source-label" for="source">Markdown 原文</label><textarea id="source" spellcheck="false" placeholder="# Hello, Publy"></textarea></section><section class="preview"><h2 id="preview-label">文章预览</h2><div class="paper"><iframe id="preview" title="Article preview" sandbox=""></iframe></div></section></div>
<p id="status" role="status" aria-live="polite"></p><p id="limits">支持文本及选定的本地图片；公式尚未实现；微信粘贴及在线投递效果待验证。</p></main><dialog id="draft-dialog" aria-labelledby="draft-heading"><h2 id="draft-heading"></h2><p id="draft-intro"></p><label id="draft-key-label" for="draft-key"></label><input id="draft-key" type="password" autocomplete="off" spellcheck="false"><button id="draft-connect" type="button"></button><label id="draft-account-label" for="draft-account"></label><select id="draft-account" disabled></select><label id="draft-title-label" for="draft-title"></label><input id="draft-title" maxlength="64"><output id="draft-summary"></output><p id="draft-status" role="status" aria-live="polite"></p><div class="draft-actions"><button id="draft-close" type="button"></button><button id="draft-reconcile" type="button" hidden></button><button id="draft-review" type="button" disabled></button><button id="draft-send" class="draft-primary" type="button" hidden disabled></button></div></dialog><script src="workbench.js" defer></script></body></html>
