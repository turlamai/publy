name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: node scripts/check-plugin-metadata.mjs
      - run: node --test scripts/verify-plugin-layout.test.mjs
      - run: node --test scripts/verify-restore-quarantine.test.mjs
      - run: node scripts/verify-plugin.mjs

  racket-ws:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.2
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: Check out pinned Permit verifier
        uses: actions/checkout@v4
        with:
          repository: turlamai/permit
          ref: 4ac89f540bf6ddc3f337239d974a198612f8e705
          path: .deps/permit
      - name: Install websocket and Permit test dependencies
        run: |
          raco pkg install --auto --batch websocket
          raco pkg install --auto --batch --no-docs --name permit .deps/permit
      - name: Run Racket tests
        run: raco test racket
