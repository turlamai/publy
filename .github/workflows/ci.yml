name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # GitHub retains at most one pending job per concurrency group.
  # Every main push needs its own evidence; only newer revisions of the
  # same PR may supersede an older queued or running PR check.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commerce-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Bogdanp/setup-racket@v1.2
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - uses: actions/checkout@v4
        with:
          repository: turlamai/permit
          ref: bba48fd460de6602d1d62afe7644c0ebd2dd62e6
          path: .deps/permit
      - uses: actions/checkout@v4
        with:
          repository: turlamai/commerce
          ref: 9ebb962aedcd85687d7206984354181d81d64406
          path: .deps/commerce
      - run: raco pkg install --auto --batch --no-docs --name permit .deps/permit
      - run: raco pkg install --auto --batch --no-docs --name commerce .deps/commerce
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Verify synthetic signed withdrawal and replay fence
        run: node scripts/verify-commerce-shadow.mjs
        env:
          COMMERCE_ROOT: ${{ github.workspace }}/.deps/commerce
          PERMIT_ROOT: ${{ github.workspace }}/.deps/permit
      - name: Verify Vibe Pay checkout against the Racket Commerce signer
        run: node scripts/verify-commerce-checkout.mjs
        env:
          COMMERCE_ROOT: ${{ github.workspace }}/.deps/commerce
          PERMIT_ROOT: ${{ github.workspace }}/.deps/permit
      - name: Verify private purchase, recovery and refund lifecycle
        run: node scripts/verify-commerce-lifecycle.mjs
        env:
          COMMERCE_ROOT: ${{ github.workspace }}/.deps/commerce
          PERMIT_ROOT: ${{ github.workspace }}/.deps/permit

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth: 0 so check-plugin-metadata.mjs can match every
      # versions.json entry against a local git tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: node scripts/build-workbench.mjs
      - run: node --test packages/workbench/tests/hosted-client.test.mjs
      - run: node --test scripts/public-web-generation.test.mjs
      - run: node scripts/sync-public-web.mjs --check
      - run: node scripts/build-user-pages.mjs --check
      - run: node scripts/check-user-journey.mjs
      - run: node scripts/check-plugin-metadata.mjs
      - run: node --test scripts/verify-plugin-layout.test.mjs
      - run: node --test scripts/verify-restore-quarantine.test.mjs
      - run: node scripts/verify-plugin.mjs

  racket-ws:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Bogdanp/setup-racket@v1.2
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - name: Check out pinned Permit verifier
        uses: actions/checkout@v4
        with:
          repository: turlamai/permit
          ref: bba48fd460de6602d1d62afe7644c0ebd2dd62e6
          path: .deps/permit
      - name: Install websocket and Permit test dependencies
        run: |
          raco pkg install --auto --batch websocket
          raco pkg install --auto --batch --no-docs --name permit .deps/permit
      - name: Run Racket tests
        run: raco test racket
