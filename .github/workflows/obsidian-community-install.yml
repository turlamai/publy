# Three-file runtime smoke; real Obsidian desktop acceptance remains #12/#15.
name: Obsidian Community Directory three-file gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  community-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # fetch-depth: 0 so check-plugin-metadata.mjs can match every
      # versions.json entry against a local git tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Verify built plugin metadata
        run: node scripts/check-plugin-metadata.mjs
      - name: Verify only Community Directory files (no ZIP or sidecars)
        run: node scripts/verify-plugin.mjs --community-only
