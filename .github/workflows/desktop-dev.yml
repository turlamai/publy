name: Desktop development host

on:
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/workbench/**'
      - 'packages/core/**'
      - 'scripts/build-workbench.mjs'
      - '.github/workflows/desktop-dev.yml'

jobs:
  build-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: Bogdanp/setup-racket@v1.2
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: stable
      - uses: actions/checkout@v4
        with:
          repository: turlamai/glaze
          ref: ba2442bb001910d20bca41d0de876e58d6341b63
          path: .deps/glaze
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
      - run: raco pkg install --auto --batch --no-docs --link .deps/glaze
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-workbench.mjs
      - run: raco test packages/desktop/main.rkt
